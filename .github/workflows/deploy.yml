name: Test, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: position-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: 1. Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Run calculation tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Save production build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize validation and deployment eligibility
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPLOY_ENABLED: ${{ vars.VPS_DEPLOY_ENABLED }}
        run: |
          echo "## Test and build: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "Deployment skipped: only main pushes or manual main runs deploy." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "Deployment skipped: VPS_DEPLOY_ENABLED is not true." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "VPS deployment is enabled and requires this job to succeed." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: 2. Deploy to VPS
    needs: test-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
    steps:
      - name: Download the tested production build
        uses: actions/download-artifact@v5
        with:
          name: production-site
          path: dist/

      - name: Validate deployment configuration
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_PRIVATE_KEY VPS_KNOWN_HOSTS VPS_TARGET_DIR; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret $name is missing." >&2
              exit 1
            fi
          done

          if ! [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "VPS_HOST must be a hostname or IPv4 address without a port." >&2
            exit 1
          fi
          if ! [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*\$?$ ]]; then
            echo "VPS_USER has an unsupported format." >&2
            exit 1
          fi
          if ! [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "VPS_SSH_PORT must be a valid TCP port." >&2
            exit 1
          fi
          if ! [[ "$VPS_TARGET_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$VPS_TARGET_DIR" == "/" || "$VPS_TARGET_DIR" == *".."* ]]; then
            echo "VPS_TARGET_DIR must be a dedicated absolute directory path." >&2
            exit 1
          fi

      - name: Configure SSH credentials and verify pinned host key
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          known_hosts_name="$VPS_HOST"
          if [[ "$VPS_PORT" != "22" ]]; then
            known_hosts_name="[$VPS_HOST]:$VPS_PORT"
          fi
          if ! ssh-keygen -F "$known_hosts_name" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "VPS_SSH_KNOWN_HOSTS has no pinned key for the configured host." >&2
            exit 1
          fi
          cat > "$HOME/.ssh/config" <<EOF
          Host position-size-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_ed25519
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Check SSH connection and prepare destination
        run: |
          set -euo pipefail
          ssh position-size-vps "mkdir -p -- '$VPS_TARGET_DIR' && test -w '$VPS_TARGET_DIR' && command -v rsync >/dev/null"

      - name: Upload production files to VPS
        run: |
          set -euo pipefail
          test -s dist/index.html
          rsync -az --delay-updates --stats -e ssh dist/ "position-size-vps:$VPS_TARGET_DIR/"

      - name: Verify uploaded files match the build
        run: |
          set -euo pipefail
          differences=$(rsync -rcn --out-format='%i %n' -e ssh dist/ "position-size-vps:$VPS_TARGET_DIR/")
          if [[ -n "$differences" ]]; then
            echo "Uploaded files differ from the production build:" >&2
            printf '%s\n' "$differences" >&2
            exit 1
          fi
          echo "All build files match the files on the VPS."

      - name: Remove deployment credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Summarize deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "## VPS deployment: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "See the individual steps for configuration, SSH, upload, and file verification results." >> "$GITHUB_STEP_SUMMARY"
          echo "File verification checks the VPS contents; it does not check public HTTP availability." >> "$GITHUB_STEP_SUMMARY"
